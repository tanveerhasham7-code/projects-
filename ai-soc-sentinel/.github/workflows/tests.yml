name: AI-SOC Sentinel tests
on:
  push:
    paths:
      - "ai-soc-sentinel/**"
  pull_request:
    paths:
      - "ai-soc-sentinel/**"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-soc-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
